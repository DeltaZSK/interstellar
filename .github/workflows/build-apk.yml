# Builds a release APK of this fork (reddit-fork branch) and publishes
# it as a GitHub Release, so it can be sideloaded without a local
# Android SDK. Runs on every push to reddit-fork.
name: Build Reddit fork APK

on:
  push:
    branches: [reddit-fork]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter analyze
      - run: flutter build apk --release

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reddit-fork-apk
          name: Interstellar Reddit fork APK
          body: |
            Release APK of the `reddit-fork` branch (Reddit support:
            browse, vote, comment with your own Reddit app client ID).
            See REDDIT.md for setup. Rebuilt on every push to
            `reddit-fork`. Signed with the debug key; sideload it
            from your phone's file manager.
          files: build/app/outputs/flutter-apk/app-release.apk
